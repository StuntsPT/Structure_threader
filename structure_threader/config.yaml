# structure_threader config
# -------------------------------------------------------
# The CLI shim writes this file automatically; you can also edit it directly.

# ---------------------------------------------------------------------------
# Wrapper selection  (-st / -fs / -mv)
# ---------------------------------------------------------------------------
wrapper: "structure"          # "structure" | "faststructure" | "maverick" | "alstructure" | "neuraladmixture"

# ---------------------------------------------------------------------------
# Input / Output  (-i, -o)
# ---------------------------------------------------------------------------
infile: "data/mydata.str"
outdir: "results/"

# ---------------------------------------------------------------------------
# K values  (-K or -Klist)
# ---------------------------------------------------------------------------
K: 6
# K_list: [2, 4, 6]

# ---------------------------------------------------------------------------
# Replicates  (-R)   [STRUCTURE only]
# ---------------------------------------------------------------------------
replicates: 10

# ---------------------------------------------------------------------------
# Random seed  (--seed)   [STRUCTURE and fastSTRUCTURE]
# ---------------------------------------------------------------------------
seed: 1235813

# ---------------------------------------------------------------------------
# STRUCTURE parameter files  (--params)
# ---------------------------------------------------------------------------
mainparams: null              # e.g. "data/mainparams"

# ---------------------------------------------------------------------------
# MavericK parameter file  (--params, mandatory for -mv)
# ---------------------------------------------------------------------------
mav_params: null              # e.g. "data/parameters.txt"

# ---------------------------------------------------------------------------
# fastSTRUCTURE prior  (--prior)
# ---------------------------------------------------------------------------
fs_prior: "simple"            # "simple" | "logistic"

# ---------------------------------------------------------------------------
# Population / individual labels  (--pop / --ind)
# ---------------------------------------------------------------------------
popfile: null
indfile: null

# ---------------------------------------------------------------------------
# Run control
# ---------------------------------------------------------------------------
threads: 4
no_tests: false
no_plots: false

# ---------------------------------------------------------------------------
# Plot options
# ---------------------------------------------------------------------------
blacknwhite: false
use_ind_labels: false

# ---------------------------------------------------------------------------
# Extra options passed verbatim to the wrapped program  (--extra_opts)
# ---------------------------------------------------------------------------
extra_opts: ""

# ---------------------------------------------------------------------------
# Clumppling alignment options
# ---------------------------------------------------------------------------
no_clumpp: false               # true → skip Clumppling entirely (--no_clumpp)
clumppling_plot_type: "graph"  # graph | list | withinK | major | all
clumppling_fig_format: "svg"   # svg | png | pdf | tiff | ...
clumppling_cd_method: "louvain" # louvain | leiden | infomap | ...
clumppling_cd_res: 1.0          # community detection resolution parameter
clumppling_vis: true            # generate figures

# ---------------------------------------------------------------------------
# Container images  (override to use a local registry mirror)
# ---------------------------------------------------------------------------
structure_image:     "docker://quay.io/biocontainers/structure:2.3.4--hec16e2b_4"
faststructure_image: "docker://quay.io/biocontainers/faststructure:1.0--py27h549429d_0"
maverick_image:      "docker://quay.io/biocontainers/maverick:1.0.5--hd03093a_3"
alstructure_image:       "docker://quay.io/biocontainers/r-alstructure:0.1.1--r43h785f33e_3"

# ---------------------------------------------------------------------------
# NeuralAdmixture options  (--exec_mode, --supervised, --nad_pop, etc.)
# ---------------------------------------------------------------------------
nad_exec_mode: "train"        # "train" | "infer"
nad_supervised: false          # true → supervised mode (requires nad_popfile)
nad_popfile: null              # population file for supervised mode
nad_init: null                 # init file path for --init_file (optional)
nad_threads: 1                 # passed as --threads to NAD (required by v1.6.7+)
nad_gpus: 0                    # number of GPUs (0 = CPU only)
nad_seed: 1235813              # NeuralAdmixture random seed

neuraladmixture_image:   "docker://quay.io/biocontainers/neural-admixture:1.2.1--pyhdfd78af_0"
clumppling_image:        "docker://quay.io/biocontainers/clumppling:2.0.7--pyhdfd78af_0"
