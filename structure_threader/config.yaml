# structure_threader config
# -------------------------------------------------------
# All options map 1-to-1 to the original CLI flags.
# The CLI shim writes this file automatically; you can also edit it directly.

# ---------------------------------------------------------------------------
# Wrapper selection  (-st / -fs)
# ---------------------------------------------------------------------------
wrapper: "structure"          # "structure" | "faststructure"

# ---------------------------------------------------------------------------
# Input / Output  (-i, -o)
# ---------------------------------------------------------------------------
infile: "data/mydata.str"
outdir: "results/"

# ---------------------------------------------------------------------------
# K values  (-K or -Klist)
# ---------------------------------------------------------------------------
K: 6                          # runs K=1..6;  comment out if using K_list
# K_list: [2, 4, 6]

# ---------------------------------------------------------------------------
# Replicates  (-R)   [STRUCTURE only — fastSTRUCTURE ignores this]
# ---------------------------------------------------------------------------
replicates: 10

# ---------------------------------------------------------------------------
# Random seed  (--seed)
# ---------------------------------------------------------------------------
seed: 1235813

# ---------------------------------------------------------------------------
# STRUCTURE parameter files  (--params)
# ---------------------------------------------------------------------------
mainparams: null              # e.g. "data/mainparams"

# ---------------------------------------------------------------------------
# fastSTRUCTURE prior  (--prior)
# ---------------------------------------------------------------------------
fs_prior: "simple"            # "simple" | "logistic"

# ---------------------------------------------------------------------------
# Population / individual labels  (--pop / --ind)
# ---------------------------------------------------------------------------
popfile: null
indfile: null

# ---------------------------------------------------------------------------
# Run control
# ---------------------------------------------------------------------------
threads: 4
no_tests: false
no_plots: false

# ---------------------------------------------------------------------------
# Plot options
# ---------------------------------------------------------------------------
blacknwhite: false
use_ind_labels: false

# ---------------------------------------------------------------------------
# Extra options passed verbatim to the wrapped program  (--extra_opts)
# ---------------------------------------------------------------------------
extra_opts: ""

# ---------------------------------------------------------------------------
# Container images  (override to use a local registry mirror)
# ---------------------------------------------------------------------------
structure_image:     "docker://quay.io/biocontainers/structure:2.3.4--hec16e2b_4"
faststructure_image: "docker://quay.io/biocontainers/faststructure:1.0--py27h9801fc8_5"
